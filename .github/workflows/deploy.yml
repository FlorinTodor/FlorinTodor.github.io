name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada 12 horas se vuelve a publicar para refrescar /visitas/ (la página
  # cifrada con las visitas de GoatCounter; ver scripts/visitas.py).
  schedule:
    - cron: '17 5,17 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Si empujas dos veces seguidas, cancela el despliegue anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El VideoObject de cada demo saca su uploadDate del commit que tocó
          # el MP4, así que hace falta el historial y no sólo el último commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Corta el despliegue si algo se ha quedado sin traducir. No necesita las
      # dependencias, así que va antes del npm ci y falla en segundos.
      #
      # Para publicar igualmente (un arreglo urgente en español, sin tiempo de
      # traducirlo): Actions -> Desplegar en GitHub Pages -> Run workflow. Al
      # lanzarlo a mano no se comprueba. Es a propósito que haya que ir a
      # buscarlo: si el salto fuera cómodo, dejaría de ser una regla.
      - name: Comprobar que la versión inglesa está al día
        if: github.event_name != 'workflow_dispatch'
        run: npm run comprobar
      - run: npm ci
      - run: npm run build
      # Va después del build para quedar fuera del sitemap. Si GoatCounter falla,
      # la página sale con el aviso y el sitio se publica igual.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Página de visitas
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          VISITAS_CLAVE: ${{ secrets.VISITAS_CLAVE }}
        run: python scripts/visitas.py --publicar dist/visitas/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

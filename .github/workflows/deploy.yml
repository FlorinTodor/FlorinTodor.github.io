name: Desplegar en Cloudflare

# La web (dist/) y el Worker de las visitas (worker/) en Cloudflare Workers,
# con wrangler.jsonc. Necesita los secretos CLOUDFLARE_API_TOKEN y
# CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push mientras otro se publica espera a que acabe (no se corta a medias).
concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          # El VideoObject de cada demo saca su uploadDate del commit que tocó
          # el MP4, así que hace falta el historial y no sólo el último commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Corta el despliegue si algo se ha quedado sin traducir. No necesita las
      # dependencias, así que va antes del npm ci y falla en segundos.
      #
      # Para publicar igualmente (un arreglo urgente en español, sin tiempo de
      # traducirlo): Actions -> Desplegar en Cloudflare -> Run workflow. Al
      # lanzarlo a mano no se comprueba. Es a propósito que haya que ir a
      # buscarlo: si el salto fuera cómodo, dejaría de ser una regla.
      - name: Comprobar que la versión inglesa está al día
        if: github.event_name != 'workflow_dispatch'
        run: npm run comprobar
      - run: npm ci
      - name: Pruebas del Worker
        run: npm test
      # astro build y, después, los tamaños de dist/media/ para el Worker.
      - run: npm run build
      # Las migraciones de migrations/ van antes que el Worker que las usa.
      - name: Base de datos y Worker
        run: |
          npx wrangler d1 migrations apply visitas-portafolio --remote
          npx wrangler deploy

<style>
:root{
  --ground:#f4f5f7; --surface:#ffffff; --surface-2:#eceef2; --line:#d8dbe2;
  --ink:#151920; --ink-2:#4e5666; --ink-3:#828b9c;
  --steel:#2a78d6; --steel-soft:#dce9fa;
  --brass:#a8730a; --up:#137a55; --down:#c33f38;
  --grid:#e3e6ec;
  --shadow:0 1px 2px rgba(20,24,32,.06),0 8px 24px rgba(20,24,32,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101318; --surface:#171b22; --surface-2:#1e232b; --line:#2b323d;
    --ink:#e9ecf2; --ink-2:#a3adbe; --ink-3:#717c8f;
    --steel:#5598e7; --steel-soft:#1b2c44;
    --brass:#e0a32e; --up:#3ec08d; --down:#e66767;
    --grid:#252b34;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --ground:#101318; --surface:#171b22; --surface-2:#1e232b; --line:#2b323d;
  --ink:#e9ecf2; --ink-2:#a3adbe; --ink-3:#717c8f;
  --steel:#5598e7; --steel-soft:#1b2c44;
  --brass:#e0a32e; --up:#3ec08d; --down:#e66767;
  --grid:#252b34;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1320px;margin:0 auto;padding:22px 20px 56px}

/* ---------- cabecera ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 30px;margin-bottom:20px}
h1{
  font-family:Archivo,ui-sans-serif,sans-serif;font-weight:800;
  font-size:clamp(23px,3.2vw,33px);letter-spacing:-.024em;margin:0;
  text-wrap:balance;
}
.sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
.totals{display:flex;gap:26px;margin-left:auto;flex-wrap:wrap}
.tot .k{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;
  font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  display:block;line-height:1.15;
}
.tot .l{
  font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);
}

/* ---------- rejilla ---------- */
/* El display de una clase gana al display:none que el navegador le da a
   [hidden], asi que #sec-fuerza (class="grid") seguia viendose en todas las
   pestanas. Hace falta el !important para que hidden mande siempre. */
[hidden]{display:none!important}
/* Las animaciones de Hevy son MP4, no GIF: mismo hueco y mismo recorte */
video.thumb,video.dgif{object-fit:cover;background:var(--bg-2)}
.reflbl{fill:var(--ink-3);font-size:11px;font-family:inherit}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{
  font:inherit;font-size:13px;font-weight:500;padding:9px 15px;cursor:pointer;
  background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--ink-3);margin-bottom:-1px;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--steel);border-bottom-color:var(--steel)}

.cards{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);padding:18px 20px}
.card h3{font-family:Archivo,sans-serif;font-weight:700;font-size:16px;margin:0 0 2px;
  letter-spacing:-.015em}
.note{font-size:11.5px;color:var(--ink-3);margin:0 0 14px}
.legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--ink-2);flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;
  vertical-align:-1px}
.hm{display:block;width:100%;height:auto}
.blank{color:var(--ink-3);font-size:12.5px;padding:24px 0;text-align:center}
.tiles.wide{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.tile .v em{font-style:normal;font-size:11px;color:var(--ink-3);margin-left:3px}
.chg{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  display:block;margin-top:2px}
.minigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
/* las de la sesion llevan barras y cifras encima: con 270px se pisan */
.minigrid.ancha{grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px 22px}
.minigrid.ancha .note{margin-bottom:6px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-3);padding:5px 8px;border-bottom:1px solid var(--line);font-weight:600}
.cmp th:first-child{text-align:left}
.cmp td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.cmp td:first-child{text-align:left;font-family:"IBM Plex Sans",sans-serif;color:var(--ink-2)}
.cmp tr:last-child td{border-bottom:0}
.bal{display:flex;flex-direction:column;gap:7px}
.bal .fila{display:grid;grid-template-columns:96px 1fr 62px;gap:10px;align-items:center;
  font-size:12px}
.bal .nom{color:var(--ink-2);text-transform:capitalize;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bal .barra{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.bal .barra i{position:absolute;top:0;bottom:0;left:0;border-radius:4px;display:block}
.bal .barra u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);
  opacity:.55}
.bal .val{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:11px;
  font-weight:600;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface-2);
  color:var(--ink-2)}
.pill b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:8px;
  background:var(--surface-2);font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.aviso b{color:var(--ink)}
.aviso .ic{font-size:15px;line-height:1.2}
.mini h4{font-family:Archivo,sans-serif;font-size:12.5px;font-weight:600;margin:0 0 4px;
  color:var(--ink-2)}
/* ---------- raíl ---------- */
.rail{overflow:hidden;display:flex;flex-direction:column;max-height:78vh}
.railtop{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
input[type=search],select{
  width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px;
}
input[type=search]::placeholder{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-size:11px;padding:3px 9px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  font-family:inherit;
}
.chip[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#fff}
.list{overflow-y:auto;flex:1}
.row{
  display:grid;grid-template-columns:34px minmax(0,1fr) 62px 46px;gap:9px;
  align-items:center;padding:8px 12px;cursor:pointer;border:0;width:100%;
  background:transparent;text-align:left;font:inherit;color:inherit;
  border-bottom:1px solid var(--line);
}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--steel-soft)}
.row[aria-current="true"] .rname{color:var(--steel)}
.thumb{
  width:34px;height:34px;border-radius:6px;object-fit:cover;
  background:var(--surface-2);border:1px solid var(--line);
}
.thumb.ph{display:grid;place-items:center;font-size:14px;color:var(--ink-3)}
.rname{font-size:12.5px;font-weight:500;line-height:1.25;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rmeta{font-size:10.5px;color:var(--ink-3);text-transform:capitalize}
.delta{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  text-align:right;font-variant-numeric:tabular-nums;
}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}

/* ---------- detalle ---------- */
.detail{padding:18px 20px 20px}
.dhead{display:flex;gap:15px;align-items:center;margin-bottom:16px}
.dgif{
  width:78px;height:78px;border-radius:9px;object-fit:cover;flex:none;
  background:var(--surface-2);border:1px solid var(--line);
}
h2{font-family:Archivo,sans-serif;font-weight:700;font-size:21px;margin:0;
  letter-spacing:-.018em;text-wrap:balance}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 8px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);
}
.tag.pr{background:var(--brass);color:#1a1300;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-bottom:18px}
.tile{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.tile .v{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;
}
.tile .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.tile.hl .v{color:var(--brass)}

figure{margin:0}
.chartbox{position:relative}
svg{display:block;width:100%;height:auto;overflow:visible}
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:7px 10px;font-size:11.5px;box-shadow:var(--shadow);white-space:nowrap;z-index:4;
}
.tip b{font-family:"IBM Plex Mono",monospace;font-size:13px;display:block}
.tip .m{color:var(--ink-3);font-size:10.5px}
figcaption{font-size:11px;color:var(--ink-3);margin-top:8px}

.tblwrap{overflow-x:auto;margin-top:18px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{
  text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-3);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);
}
td{padding:6px 10px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace;font-size:12px}
td:first-child{font-family:"IBM Plex Sans",sans-serif}
tr:last-child td{border-bottom:0}
.isPr{color:var(--brass);font-weight:600}
.empty{color:var(--ink-3);padding:30px 0;text-align:center}
.sep{margin:22px 0 14px;border:0;border-top:1px solid var(--line)}
.h4{font-family:Archivo,sans-serif;font-weight:700;font-size:14px;margin:0 0 2px;
  letter-spacing:-.015em}
.glos{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.glos summary{cursor:pointer;font-size:12px;color:var(--ink-2);list-style:none}
.glos summary::-webkit-details-marker{display:none}
.glos summary::before{content:"▸ ";color:var(--ink-3)}
.glos[open] summary::before{content:"▾ "}
.glos dl{margin:12px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.glos dt{font-weight:600;color:var(--ink);margin-top:11px}
.glos dd{margin:2px 0 0}
.glos code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  background:var(--surface-2);padding:1px 5px;border-radius:4px}
/* ---------- visor ampliado ---------- */
.mini,.card.zoomable{position:relative}
.zoom{
  position:absolute;top:10px;right:10px;z-index:2;
  width:26px;height:26px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-3);
  font:inherit;font-size:13px;line-height:1;display:grid;place-items:center;
  opacity:0;transition:opacity .14s;
}
.mini:hover .zoom,.card.zoomable:hover .zoom,.zoom:focus-visible{opacity:1}
.zoom:hover{color:var(--steel);border-color:var(--steel)}
.mini{cursor:zoom-in}

dialog.viewer{
  border:0;padding:0;background:transparent;max-width:min(1180px,94vw);width:100%;
}
dialog.viewer::backdrop{background:rgba(8,10,14,.72);backdrop-filter:blur(2px)}
.viewer .panel{padding:22px 24px 24px}
.vhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:4px}
.vhead h3{font-family:Archivo,sans-serif;font-size:19px;font-weight:700;margin:0;
  letter-spacing:-.018em}
.vclose{
  margin-left:auto;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-2);border-radius:7px;width:30px;height:30px;cursor:pointer;
  font:inherit;font-size:15px;line-height:1;
}
.vclose:hover{color:var(--ink);border-color:var(--ink-3)}
.vstats{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 16px}
.vstats div{font-size:11px;color:var(--ink-3);text-transform:uppercase;
  letter-spacing:.07em}
.vstats b{display:block;font-family:"IBM Plex Mono",monospace;font-size:17px;
  font-weight:600;color:var(--ink);letter-spacing:-.02em;text-transform:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Machine Room</h1>
      <div class="sub" id="range"></div>
    </div>
    <div class="totals" id="totals"></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" data-t="resumen"  role="tab" aria-selected="true">Overview</button>
    <button class="tab" data-t="fuerza"   role="tab" aria-selected="false">Strength</button>
    <button class="tab" data-t="actividad" role="tab" aria-selected="false">Activity</button>
    <button class="tab" data-t="cuerpo"   role="tab" aria-selected="false">Body</button>
  </nav>

  <dialog class="viewer" id="viewer">
    <div class="panel">
      <div class="vhead">
        <div><h3 id="v-title"></h3><p class="note" id="v-note"></p></div>
        <button class="vclose" id="v-close" aria-label="Close">✕</button>
      </div>
      <div class="vstats" id="v-stats"></div>
      <div id="v-body"></div>
    </div>
  </dialog>

  <section id="sec-resumen"></section>
  <section id="sec-actividad" hidden></section>
  <section id="sec-cuerpo" hidden></section>

  <div class="grid" id="sec-fuerza" hidden>
    <aside class="panel rail">
      <div class="railtop">
        <input type="search" id="q" placeholder="Search exercise…" aria-label="Search exercise">
        <select id="sort" aria-label="Sort by">
          <option value="recent">Most recent first</option>
          <option value="volume">Most volume</option>
          <option value="trend">Best progression</option>
          <option value="stalled">Most stalled</option>
          <option value="name">Alphabetical</option>
        </select>
        <div class="chips" id="chips"></div>
      </div>
      <div class="list" id="list" role="listbox" aria-label="Exercises"></div>
    </aside>

    <section class="panel detail" id="detail"></section>
  </div>
</div>

const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString("en-GB");
const MES = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const short = iso => { const d = new Date(iso+"T00:00"); return d.getDate()+" "+MES[d.getMonth()]; };
const longd = iso => { const d = new Date(iso+"T00:00"); return d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear(); };
const daysAgo = iso => Math.round((Date.now()-new Date(iso+"T00:00"))/864e5);
// "0×12" no es una serie: en los exercises de peso corporal no hay kilos que
// enseñar, y en los de tiempo no hay ni repeticiones.
const serie = (w, r) => w ? `${w}×${r}` : r ? `${r} reps` : "—";

let state = { sel: null, q: "", sort: "recent", muscle: null };

/* ---------- cabecera ---------- */
const T = DATA.totals;
$("#range").textContent = `${longd(T.from)} — ${longd(T.to)}`;
$("#totals").innerHTML = [
  [fmt(T.sessions), "sessions"],
  [(T.volume/1000).toFixed(0)+" t", "moved"],
  [T.exercises, "exercises"],
].map(([k,l]) => `<div class="tot"><span class="k">${k}</span><span class="l">${l}</span></div>`).join("");

/* ---------- filtros por músculo ---------- */
const muscles = [...new Set(DATA.exercises.map(e => e.muscle))].sort();
$("#chips").innerHTML = muscles.map(m =>
  `<button class="chip" data-m="${m}" aria-pressed="false">${m}</button>`).join("");
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.muscle = state.muscle === b.dataset.m ? null : b.dataset.m;
  document.querySelectorAll(".chip").forEach(c =>
    c.setAttribute("aria-pressed", String(c.dataset.m === state.muscle)));
  render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value.toLowerCase(); render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });

/* ---------- sparkline ---------- */
function spark(pts, w = 62, h = 20) {
  const ys = pts.map(p => p.e).filter(Boolean);
  if (ys.length < 2) return `<svg width="${w}" height="${h}" aria-hidden="true"></svg>`;
  const lo = Math.min(...ys), hi = Math.max(...ys), sp = hi - lo || 1;
  const d = ys.map((y,i) =>
    `${(i/(ys.length-1))*w},${h-2-((y-lo)/sp)*(h-4)}`).join(" L");
  const last = ys[ys.length-1];
  return `<svg width="${w}" height="${h}" aria-hidden="true">
    <polyline points="${d.replaceAll(" L"," ")}" fill="none" stroke="var(--steel)"
      stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${w}" cy="${h-2-((last-lo)/sp)*(h-4)}" r="2.2" fill="var(--steel)"/>
  </svg>`;
}

/* ---------- lista ---------- */
function visible() {
  let out = DATA.exercises.filter(e => {
    if (state.muscle && e.muscle !== state.muscle) return false;
    if (!state.q) return true;
    return (e.name + " " + e.aliases.join(" ") + " " + e.muscle).toLowerCase().includes(state.q);
  });
  const by = {
    recent: (a,b) => b.last.localeCompare(a.last),
    volume: (a,b) => b.vol - a.vol,
    trend:  (a,b) => b.trend - a.trend,
    stalled:(a,b) => a.trend - b.trend,
    name:   (a,b) => a.name.localeCompare(b.name,"es"),
  }[state.sort];
  return out.sort(by);
}

function render() {
  const items = visible();
  if (!items.length) { $("#list").innerHTML = `<p class="empty">Nothing matches.</p>`; return; }
  if (!state.sel || !items.some(e => e.name === state.sel)) state.sel = items[0].name;

  $("#list").innerHTML = items.map(e => {
    const t = e.trend, cls = t > 1 ? "up" : t < -1 ? "down" : "flat";
    const sign = t > 0 ? "+" : "";
    return `<button class="row" role="option" data-n="${encodeURIComponent(e.name)}"
        aria-current="${e.name === state.sel}">
      ${e.anim ? `<video class="thumb" src="${e.anim}" autoplay loop muted
          playsinline preload="metadata" aria-hidden="true"></video>`
        : e.gif ? `<img class="thumb" src="${e.gif}" alt="" loading="lazy">`
              : `<span class="thumb ph">—</span>`}
      <span>
        <span class="rname">${e.name}</span>
        <span class="rmeta">${e.muscle} · ${e.sessions} sess · ${daysAgo(e.last)} d ago</span>
      </span>
      ${spark(e.pts)}
      <span class="delta ${cls}">${sign}${t}</span>
    </button>`;
  }).join("");

  $("#list").querySelectorAll(".row").forEach(r => r.onclick = () => {
    state.sel = decodeURIComponent(r.dataset.n); render();
  });
  detail(items.find(e => e.name === state.sel));
}

/* ---------- gráfica grande ---------- */
let EXAXIS = null;   // ejes de la última gráfica de ejercicio, para el hover

function chart(e) {
  const pts = e.pts.filter(p => p.e);
  if (pts.length < 2) return `<p class="empty">${
    e.pts.length < 2 ? "Only one session recorded: no curve yet."
    : "No estimated 1RM: that needs weight on the bar and sets of 12 reps or fewer."}</p>`;
  const W = 900, H = 300, P = { t: 16, r: 18, b: 30, l: 46 };
  const xs = pts.map(p => new Date(p.d + "T00:00").getTime());
  const ys = pts.map(p => p.e);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo || hi * .1) * .18; lo -= pad; hi += pad;
  const X = v => P.l + ((v - x0) / (x1 - x0 || 1)) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - lo) / (hi - lo || 1)) * (H - P.t - P.b);

  const line = pts.map((p,i) => `${i?"L":"M"}${X(xs[i]).toFixed(1)},${Y(p.e).toFixed(1)}`).join("");
  const area = `${line}L${X(xs[xs.length-1]).toFixed(1)},${H-P.b}L${X(x0).toFixed(1)},${H-P.b}Z`;

  const ticks = 4, gy = [];
  for (let i = 0; i <= ticks; i++) {
    const v = lo + (hi - lo) * i / ticks;
    gy.push(`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
      stroke="var(--grid)" stroke-width="1"/>
      <text x="${P.l-9}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11"
        fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${v.toFixed(0)}</text>`);
  }
  const nx = Math.min(6, pts.length), gx = [];
  for (let i = 0; i < nx; i++) {
    const p = pts[Math.round(i * (pts.length - 1) / (nx - 1 || 1))];
    gx.push(`<text x="${X(new Date(p.d+"T00:00").getTime()).toFixed(1)}" y="${H-8}"
      text-anchor="middle" font-size="11" fill="var(--ink-3)">${short(p.d)}</text>`);
  }
  EXAXIS = { pts, X: i => X(xs[i]), Y: i => Y(pts[i].e) };
  const prI = ys.indexOf(Math.max(...ys));
  const dots = pts.map((p,i) => `<circle class="pt" data-i="${i}"
     cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.e).toFixed(1)}"
     r="${i===prI?4.5:3}" fill="${i===prI?"var(--brass)":"var(--steel)"}"
     stroke="var(--surface)" stroke-width="2"/>`).join("");

  return `<figure><div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Estimated 1RM progression for ${e.name}">
      <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="var(--steel)" stop-opacity=".22"/>
        <stop offset="100%" stop-color="var(--steel)" stop-opacity="0"/>
      </linearGradient></defs>
      ${gy.join("")}
      <path d="${area}" fill="url(#g)"/>
      <path d="${line}" fill="none" stroke="var(--steel)" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${gx.join("")}
      <line class="cross" y1="${P.t}" y2="${H-P.b}" stroke="var(--ink-3)"
        stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <rect class="hit" x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}"
        fill="transparent"/>
    </svg>
    <div class="tip"></div>
  </div>
  <figcaption>Estimated 1RM per session (Epley). The brass dot is your record.</figcaption></figure>`;
}

function wireChartIn(raiz) {
  const box = raiz.querySelector(".chartbox");
  if (!box || !EXAXIS) return;
  const { pts, X, Y } = EXAXIS;
  hover(box, pts, X, Y, i => {
    const p = pts[i];
    return `<b>${p.e} kg</b><span class="m">${longd(p.d)} · best set
      ${p.w}kg × ${p.r} · ${p.s} sets · ${fmt(p.v)} kg of volume</span>`;
  });
}

function wireChart() {
  // ojo: hay que acotar a #detail. Con varias secciones en la página,
  // buscar ".chartbox" a secas agarraba la gráfica de otra pestaña.
  const box = $("#detail .chartbox");
  if (!box || !EXAXIS) return;
  const { pts, X, Y } = EXAXIS;
  hover(box, pts, X, Y, i => {
    const p = pts[i];
    return `<b>${p.e} kg</b><span class="m">${longd(p.d)} · best set
      ${p.w}kg × ${p.r} · ${p.s} sets · ${fmt(p.v)} kg of volume</span>`;
  });
}

/* ---------- las gráficas de la sesión ----------

   La curva de 1RM cuenta lo fuerte que estás, pero no lo que hiciste ese día:
   dos sessions con el mismo 1RM estimado pueden ser dos series or five. Aquí
   va la carga: cuánto moviste, con qué serie, cuántas series y cuándo cayó
   cada récord.

   Qué se dibuja depende del ejercicio. Los de peso corporal (flexiones) no
   tienen volumen que enseñar y sí repeticiones; los de tiempo (comba, cinta)
   no tienen ninguna of the dos. Pintarles una gráfica a cero sería enseñar un
   número que no existe.                                                     */

function graficasSesion(e) {
  const pts = e.pts;
  const hayWeight = pts.some(p => p.w > 0);
  const conRm = pts.filter(p => p.e);
  const sinRm = pts.length - conRm.length;
  const tarjetas = [];
  // en que se mide la carga de este ejercicio, para no prometer repeticiones
  // en uno que solo tiene minutos
  let carga = null;

  // 1. la carga del día, en la unidad que tenga sentido para este ejercicio
  if (pts.some(p => p.v > 0)) {
    carga = "kg";
    tarjetas.push({
      id: "gs-carga", titulo: "Session load",
      nota: "Kilos moved that day: weight × reps across every set",
      stats: resumen(pts, "v", 0, "kg"),
      visor: "Weight × reps summed across every working set",
      pinta: (c, h) => barChart(c, pts, "v", {
        h, unit: "kg", label: "Session load", cima: p => fmtn(p.v),
        marca: p => e.prDate && p.d === e.prDate,
        tip: p => `<b>${fmt(p.v)} kg</b><span class="m">${longd(p.d)} · ${p.s} sets ·
          ${p.n} reps · best set ${serie(p.w, p.r)}</span>`,
      }),
    });
  } else if (pts.some(p => p.n > 0)) {
    carga = "reps";
    tarjetas.push({
      id: "gs-carga", titulo: "Session reps",
      nota: "This exercise carries no weight, so the load is counted in reps",
      stats: resumen(pts, "n", 0, "reps"),
      visor: "Working reps of the day, warm-ups aside",
      pinta: (c, h) => barChart(c, pts, "n", {
        h, unit: "reps", label: "Repeticiones", color: PAL.up, cima: p => p.n,
        tip: p => `<b>${p.n} reps</b><span class="m">${longd(p.d)} ·
          ${p.s} sets · best ${serie(p.w, p.r)}</span>`,
      }),
    });
  } else if (pts.some(p => p.t > 0)) {
    carga = "min";
    tarjetas.push({
      id: "gs-carga", titulo: "Minutes per session",
      nota: "This exercise is logged by time: no kilos, no reps",
      stats: resumen(pts, "t", 0, "min"),
      visor: "Minutes logged in Hevy",
      pinta: (c, h) => barChart(c, pts, "t", {
        h, unit: "min", label: "Minutes", color: PAL.up, cima: p => p.t,
        tip: p => `<b>${p.t} min</b><span class="m">${longd(p.d)} · ${p.s} sets</span>`,
      }),
    });
  }

  // 2. con qué carga: the heaviest set de cada día, con sus repeticiones
  if (hayWeight) {
    const conWeight = pts.filter(p => p.w > 0);
    tarjetas.push({
      id: "gs-peso", titulo: "Weight of the best set",
      nota: "The plate you moved, with the reps above each bar",
      stats: resumen(conWeight, "w", 1, "kg"),
      visor: "The best set of each session: weight, with the reps above",
      pinta: (c, h) => barChart(c, conWeight, "w", {
        h, unit: "kg", label: "Weight of the best set", color: PAL.steel,
        cima: p => "×" + p.r, marca: p => e.prWDate && p.d === e.prWDate,
        tip: p => `<b>${serie(p.w, p.r)}</b><span class="m">${longd(p.d)} ·
          the best set of that session${e.prWDate === p.d ? " · your heaviest set" : ""}</span>`,
      }),
    });
  }

  // 3. cuánto trabajo: las series son la unidad con la que se programa
  tarjetas.push({
    id: "gs-series", titulo: "Sets per session",
    nota: "Working sets, warm-ups aside. This is what the per-muscle split counts",
    stats: resumen(pts, "s", 0, "sets"),
    visor: "Working sets per session",
    pinta: (c, h) => barChart(c, pts, "s", {
      h, unit: "sets", label: "Sets", color: PAL.brass, cima: p => p.s,
      tip: p => `<b>${p.s} sets</b><span class="m">${longd(p.d)} ·
        ${p.n} reps${p.v ? ` · ${fmt(p.v)} kg` : ""}</span>`,
    }),
  });

  // 4. los récords: lo del día contra lo mejor que llevabas
  if (conRm.length >= 2) {
    tarjetas.push({
      id: "gs-pr", titulo: "Records",
      nota: "Each day against the best 1RM you had up to that date",
      stats: resumen(conRm, "e", 1, "kg"),
      visor: "The brass line only goes up: when it flattens, the record hasn't fallen in a while",
      pinta: (c, h) => escalera(c, pts, { h }),
    });
  }

  const html = `
    <hr class="sep">
    <p class="h4">Each day's load</p>
    <p class="note">The curve above says how strong you are; these say what
      you did. Two sessions with the same estimated 1RM can be two working sets
      or five.${!sinRm ? "" : !hayWeight
        ? ` This exercise carries no weight, so there is no 1RM to estimate: the
          load is counted in ${carga === "min" ? "minutos" : "repeticiones"}.`
        : ` In ${sinRm} of the ${pts.length} sessions there is no estimated 1RM because
          no set went below 12 reps: the load is there, the 1RM isn't.`}</p>
    <div class="minigrid ancha">
      ${tarjetas.map(c => `<div class="mini">
        <h4>${c.titulo}</h4><p class="note">${c.nota}</p>
        <div id="${c.id}"></div></div>`).join("")}
    </div>
    ${glosario(e)}`;

  const pintar = () => tarjetas.forEach(c => {
    const box = $("#" + c.id);
    if (!box) return;
    c.pinta(box, 200);
    ampliable(box.closest(".mini"), {
      titulo: `${c.titulo} · ${e.name}`, nota: c.visor, stats: c.stats,
      dibuja: caja => c.pinta(caja, 430),
    });
  });

  return { html, pintar };
}

/* El glosario que contesta a "¿y la diferencia entre PR y RM?", con los
   números de este ejercicio dentro para que no sea teoría. */
function glosario(e) {
  const pesada = e.prW ? serie(e.prW, e.prR) : null;
  return `<details class="glos">
    <summary>What a PR is, what the 1RM is and what volume is</summary>
    <dl>
      <dt>Set</dt>
      <dd><code>70×10</code> is 70 kg lifted 10 times in a row. Warm-ups
        are left out of every number on this page.</dd>

      <dt>Volume — the day's load</dt>
      <dd>Weight × reps, summed across every set. It is how much you moved
        in total, and it goes up when you do more work even at the same weight.</dd>

      <dt>1RM</dt>
      <dd>The most weight you could lift <b>a single time</b>. Here it is never
        measured: it is <b>estimated</b> with the Epley formula
        (<code>weight × (1 + reps/30)</code>) from your best real set. That is why
        it says «est. 1RM». Above 12 reps the formula stops being
        reliable and the cell is left blank.</dd>

      <dt>PR — personal record</dt>
      <dd>The best you have actually done <b>for real</b>, and there is more than one. The weight one is
        the heaviest set${pesada ? `: yours is <b>${pesada}</b>${
          e.prWDate ? `, from ${longd(e.prWDate)}` : ""}` : ""}. The strength one is the
        highest estimated 1RM${e.prE ? `: <b>${e.prE} kg</b>${
          e.prDate ? `, from ${longd(e.prDate)}` : ""}` : ""}.${
        e.prWDate && e.prDate && e.prWDate !== e.prDate
          ? " They didn't fall on the same day, which is why they are kept apart." : ""}</dd>

      <dt>The difference, in one line</dt>
      <dd>A PR is a fact; the 1RM is arithmetic done on top of that fact. And
        a PR can fall without touching more weight: <code>70×12</code> is more than
        <code>70×10</code> with the same plate.</dd>
    </dl>
  </details>`;
}

/* ---------- panel de detalle ---------- */
function detail(e) {
  if (!e) return;
  const t = e.trend, cls = t > 1 ? "up" : t < -1 ? "down" : "flat";
  const rows = [...e.pts].reverse().slice(0, 14);
  const prE = e.prE;
  const gs = graficasSesion(e);
  $("#detail").innerHTML = `
    <div class="dhead">
      ${e.anim ? `<video class="dgif" src="${e.anim}" autoplay loop muted
          playsinline aria-label="Demonstration of ${e.name}"></video>`
        : e.gif ? `<img class="dgif" src="${e.gif}" alt="Demonstration of ${e.name}">`
              : `<span class="dgif"></span>`}
      <div>
        <h2>${e.name}</h2>
        <div class="tags">
          <span class="tag">${e.muscle}</span>
          ${e.equip ? `<span class="tag">${e.equip}</span>` : ""}
          ${e.prDate && daysAgo(e.prDate) < 30 ? `<span class="tag pr">Recent PR</span>` : ""}
        </div>
      </div>
    </div>
    <div class="tiles">
      <div class="tile hl"><span class="v">${e.prE ?? "—"} kg</span><span class="l">Est. 1RM record</span></div>
      <div class="tile"><span class="v">${e.prW != null ? serie(e.prW, e.prR) : "—"}</span>
        <span class="l">Heaviest set</span></div>
      <div class="tile"><span class="v ${cls}">${t > 0 ? "+" : ""}${t} kg</span><span class="l">Trend</span></div>
      <div class="tile"><span class="v">${e.sessions}</span><span class="l">Sessions</span></div>
      <div class="tile"><span class="v">${(e.vol/1000).toFixed(1)} t</span><span class="l">Total volume</span></div>
      <div class="tile"><span class="v">${daysAgo(e.last)} d</span><span class="l">Since the last one</span></div>
      ${e.prDate ? `<div class="tile"><span class="v ${daysAgo(e.prDate) > 60 ? "down" : ""}">${
        daysAgo(e.prDate)} d</span><span class="l">Since the record</span></div>` : ""}
      ${e.next ? `<div class="tile hl"><span class="v">${e.next.w}<em>kg</em> × ${e.next.r}</span>
        <span class="l">Next target</span></div>` : ""}
    </div>
    ${e.next ? `<p class="note" style="margin:-6px 0 16px">Double progression: the
      last time you did <b>${e.next.de}</b>, so now it's ${e.next.sube === "reps"
      ? `the same load and <b>one more rep</b>`
      : `going up to <b>${e.next.w} kg</b> and back down to 8 reps`}. It is a
      calculated guide, not what the day feels like.</p>` : ""}
    ${chart(e)}
    ${gs.html}
    <div class="tblwrap"><table>
      <thead><tr><th>Date</th><th>Est. 1RM</th><th>Best set</th><th>Sets</th>
        <th>Reps</th><th>Volume</th></tr></thead>
      <tbody>${rows.map(p => `<tr>
        <td>${longd(p.d)}</td>
        <td class="${p.e === prE ? "isPr" : ""}">${p.e || "—"}</td>
        <td>${serie(p.w, p.r)}</td><td>${p.s}</td><td>${p.n || "—"}</td>
        <td>${p.v ? fmt(p.v) : "—"}</td></tr>`).join("")}
      </tbody></table></div>
    ${e.aliases.length ? `<p class="sub" style="margin-top:12px">Also recorded as:
      ${e.aliases.join(" · ")}</p>` : ""}`;
  gs.pintar();
  wireChart();
  const cb = $("#detail .chartbox");
  if (cb) {
    cb.parentElement.classList.add("zoomable");
    ampliable(cb.parentElement, {
      titulo: e.name, nota: "Estimated 1RM per session (Epley)",
      stats: resumen(e.pts.filter(p => p.e), "e", 1, "kg"),
      dibuja: c => { c.innerHTML = chart(e); wireChartIn(c); },
    });
  }
}


/* ================= gráficas compartidas (SVG + hover) ================= */

const PAL = { steel:"var(--steel)", brass:"var(--brass)", up:"var(--up)", down:"var(--down)" };

function axes(W, H, P, lo, hi, ticks = 4) {
  let g = "";
  for (let i = 0; i <= ticks; i++) {
    const v = lo + (hi - lo) * i / ticks;
    const y = P.t + (1 - (v - lo) / (hi - lo || 1)) * (H - P.t - P.b);
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"
      stroke="var(--grid)" stroke-width="1"/>
      <text x="${P.l - 9}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11"
        fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${fmtn(v)}</text>`;
  }
  return g;
}
// el cero de los ejes que arrancan en cero salia como "0.0"
const fmtn = v => v === 0 ? "0"
                : Math.abs(v) >= 1000 ? (v / 1000).toFixed(1).replace(".0", "") + "k"
                : Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(1);

function xLabels(pts, X, H, n = 6) {
  let g = "";
  const step = Math.max(1, Math.round((pts.length - 1) / (n - 1)));
  for (let i = 0; i < pts.length; i += step) {
    g += `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10.5"
      fill="var(--ink-3)">${short(pts[i].d)}</text>`;
  }
  return g;
}

/* línea con media móvil opcional */
function lineChart(box, pts, key, opts = {}) {
  const has = pts.filter(p => p[key] != null);
  if (has.length < 2) { box.innerHTML = `<p class="blank">Not enough data yet.</p>`; return; }
  const W = 900, H = opts.h || 240, P = { t: 14, r: 16, b: 28, l: 46 };
  const ys = has.map(p => p[key]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo || hi * .1) * .16;
  lo = opts.zero ? 0 : lo - pad; hi += pad;
  // una referencia fuera del rango no se veria: se estira el eje para meterla
  if (opts.ref != null) { lo = Math.min(lo, opts.ref); hi = Math.max(hi, opts.ref); }
  const X = i => P.l + (i / (has.length - 1 || 1)) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - lo) / (hi - lo || 1)) * (H - P.t - P.b);
  const color = opts.color || PAL.steel;

  const raw = has.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p[key]).toFixed(1)}`).join("");
  let avg = "";
  const win = opts.avg || 0;
  if (win && has.length >= win + 2) {
    const m = has.map((_, i) => {
      const w = has.slice(Math.max(0, i - win + 1), i + 1).map(p => p[key]);
      return w.reduce((a, b) => a + b, 0) / w.length;
    });
    avg = m.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  }

  box.innerHTML = `<div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label || key}">
      <defs><linearGradient id="gr${key}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="${avg ? .10 : .20}"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      ${axes(W, H, P, lo, hi)}
      <path d="${raw}L${X(has.length - 1).toFixed(1)},${H - P.b}L${P.l},${H - P.b}Z"
        fill="url(#gr${key})"/>
      <path d="${raw}" fill="none" stroke="${color}" stroke-width="${avg ? 1 : 2}"
        stroke-opacity="${avg ? .38 : 1}" stroke-linejoin="round"/>
      ${avg ? `<path d="${avg}" fill="none" stroke="${color}" stroke-width="2.4"
        stroke-linejoin="round" stroke-linecap="round"/>` : ""}
      ${opts.ref != null ? `<line x1="${P.l}" x2="${W - P.r}"
        y1="${Y(opts.ref).toFixed(1)}" y2="${Y(opts.ref).toFixed(1)}"
        stroke="var(--ink-3)" stroke-width="1.2" stroke-dasharray="5 4"/>
        <text x="${W - P.r}" y="${(Y(opts.ref) - 6).toFixed(1)}" text-anchor="end"
        class="reflbl">${opts.refLabel || ""}</text>` : ""}
      ${xLabels(has, X, H)}
      <line class="cross" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)"
        stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <rect class="hit" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}"
        height="${H - P.t - P.b}" fill="transparent"/>
    </svg><div class="tip"></div></div>
    ${avg ? `<div class="legend"><span><i style="background:${color};opacity:.4"></i>daily</span>
      <span><i style="background:${color}"></i>${win}-day average</span></div>` : ""}`;

  hover(box, has, i => X(i), i => Y(has[i][key]), i =>
    `<b>${opts.unit ? has[i][key] + " " + opts.unit : has[i][key]}</b>
     <span class="m">${longd(has[i].d)}</span>`);
}

/* dos series en la misma caja: pulso peak y average del día.
   No es un stackChart (no se suman) ni dos lineChart (compararlas exige el
   mismo eje), asi que es su propia función, cortita. */
function dobleLinea(box, pts, keys, colors, names, unidad, alto) {
  const has = pts.filter(p => keys.some(k => p[k] != null));
  if (has.length < 2) { box.innerHTML = `<p class="blank">Not enough data yet.</p>`; return; }
  const W = 900, H = alto || 240, P = { t: 14, r: 16, b: 28, l: 46 };
  const todos = has.flatMap(p => keys.map(k => p[k]).filter(v => v != null));
  let lo = Math.min(...todos), hi = Math.max(...todos);
  const pad = (hi - lo || hi * .1) * .16; lo -= pad; hi += pad;
  const X = i => P.l + (i / (has.length - 1 || 1)) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - lo) / (hi - lo || 1)) * (H - P.t - P.b);

  // un hueco parte la línea en vez de inventar una recta entre dos días
  const trazo = k => has.map((p, i) => p[k] == null ? ""
    : `${i && has[i - 1][k] != null ? "L" : "M"}${X(i).toFixed(1)},${Y(p[k]).toFixed(1)}`).join("");

  box.innerHTML = `<div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${names.join(" y ")}">
      ${axes(W, H, P, lo, hi)}
      ${keys.map((k, j) => `<path d="${trazo(k)}" fill="none" stroke="${colors[j]}"
        stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}
      ${xLabels(has, X, H)}
      <line class="cross" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)"
        stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <rect class="hit" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}"
        height="${H - P.t - P.b}" fill="transparent"/>
    </svg><div class="tip"></div></div>
    <div class="legend">${names.map((n, j) =>
      `<span><i style="background:${colors[j]}"></i>${n}</span>`).join("")}</div>`;

  hover(box, has, i => X(i), i => Y(has[i][keys[0]] ?? has[i][keys[1]]), i =>
    `<b>${keys.map((k, j) => has[i][k] == null ? "" :
        `${names[j]} ${has[i][k]} ${unidad}`).filter(Boolean).join(" · ")}</b>
     <span class="m">${longd(has[i].d)}</span>`);
}

/* barras apiladas: usado para las fases del sueño */
function stackChart(box, pts, keys, colors, names, opts = {}) {
  const has = pts.filter(p => keys.some(k => p[k] != null));
  if (!has.length) { box.innerHTML = `<p class="blank">No data yet.</p>`; return; }
  const W = 900, H = opts.h || 240, P = { t: 14, r: 16, b: 28, l: 46 };
  const tot = has.map(p => keys.reduce((a, k) => a + (p[k] || 0), 0));
  const hi = Math.max(...tot) * 1.12;
  const bw = Math.min(26, (W - P.l - P.r) / has.length * .74);
  const X = i => P.l + (i + .5) / has.length * (W - P.l - P.r);
  const Y = v => P.t + (1 - v / hi) * (H - P.t - P.b);

  let bars = "";
  has.forEach((p, i) => {
    let acc = 0;
    keys.forEach((k, j) => {
      const v = p[k] || 0;
      if (!v) return;
      const y0 = Y(acc + v), y1 = Y(acc);
      // 2px de hueco entre segmentos, para que se lean como piezas
      bars += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${y0.toFixed(1)}"
        width="${bw.toFixed(1)}" height="${Math.max(0, y1 - y0 - 2).toFixed(1)}"
        fill="${colors[j]}" rx="2"/>`;
      acc += v;
    });
  });

  box.innerHTML = `<div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label || ""}">
      ${axes(W, H, P, 0, hi)}${bars}${xLabels(has, X, H)}
      <rect class="hit" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}"
        height="${H - P.t - P.b}" fill="transparent"/>
    </svg><div class="tip"></div></div>
    <div class="legend">${names.map((n, j) =>
      `<span><i style="background:${colors[j]}"></i>${n}</span>`).join("")}</div>`;

  hover(box, has, i => X(i), i => Y(tot[i]), i =>
    `<b>${tot[i].toFixed(1)} h</b><span class="m">${longd(has[i].d)} · ` +
    keys.map((k, j) => `${names[j]} ${(has[i][k] || 0).toFixed(1)}`).join(" · ") + `</span>`);
}

/* barras de una sola serie: la carga de la sesión, las series, los minutos.
   stackChart ya dibuja barras, pero apila y habla en horas; esto es una sola
   pieza por día, con el tooltip que le pases. */
function barChart(box, pts, key, opts = {}) {
  const has = pts.filter(p => p[key] != null);
  if (!has.length) { box.innerHTML = `<p class="blank">${
    opts.vacio || "No data yet."}</p>`; return; }
  const W = 900, H = opts.h || 200, P = { t: 20, r: 16, b: 28, l: 46 };
  const hi = (Math.max(...has.map(p => p[key])) || 1) * 1.18;
  const bw = Math.min(30, (W - P.l - P.r) / has.length * .72);
  const X = i => P.l + (i + .5) / has.length * (W - P.l - P.r);
  const Y = v => P.t + (1 - v / hi) * (H - P.t - P.b);
  const color = opts.color || PAL.steel;
  // el día del record va en latón, igual que el punto de la gráfica de arriba
  const marca = opts.marca || (() => false);

  const bars = has.map((p, i) => {
    const y = Y(p[key] || 0), alta = marca(p, i);
    return `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${bw.toFixed(1)}" height="${Math.max(1, H - P.b - y).toFixed(1)}"
      rx="2" fill="${alta ? PAL.brass : color}" fill-opacity="${alta ? 1 : .82}"/>`;
  }).join("");
  // La cifra encima de cada barra solo cabe si la barra es ancha Y hay pocas.
  // El viewBox es el mismo en la tarjeta y en el visor, asi que "pocas" solo
  // vale para la tarjeta: ampliada, el mismo dibujo sale al doble de tamano.
  const grande = (opts.h || 200) >= 300;
  const cimas = opts.cima && bw >= 15 && (grande || has.length <= 14)
    ? has.map((p, i) =>
    `<text x="${X(i).toFixed(1)}" y="${(Y(p[key]) - 7).toFixed(1)}" text-anchor="middle"
      font-size="10" fill="var(--ink-3)"
      font-family="IBM Plex Mono,monospace">${opts.cima(p, i)}</text>`).join("") : "";

  box.innerHTML = `<div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label || key}">
      ${axes(W, H, P, 0, hi)}${bars}${cimas}${xLabels(has, X, H)}
      <rect class="hit" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}"
        height="${H - P.t - P.b}" fill="transparent"/>
    </svg><div class="tip"></div></div>
    ${opts.leyenda ? `<div class="legend">${opts.leyenda}</div>` : ""}`;

  hover(box, has, i => X(i), i => Y(has[i][key]), i => opts.tip ? opts.tip(has[i], i)
    : `<b>${fmt(has[i][key])}${opts.unit ? " " + opts.unit : ""}</b>
       <span class="m">${longd(has[i].d)}</span>`);
}

/* la escalera de récords.

   Debajo, el 1RM estimado de cada sesión, que sube y baja según el día que
   tuvieras. Encima, el mejor que llevabas hasta esa fecha: esa línea SOLO
   sube, y cuando se queda plana muchas sessions es que el ejercicio está
   estancado. Es la diferencia entre "lo de hoy" y "tu récord" dibujada. */
function escalera(box, pts, opts = {}) {
  const has = pts.filter(p => p.e);
  if (has.length < 2) {
    box.innerHTML = `<p class="blank">That needs more than one session with an estimated 1RM.</p>`;
    return;
  }
  const W = 900, H = opts.h || 200, P = { t: 16, r: 16, b: 28, l: 46 };
  let tope = 0;
  const rec = has.map(p => (tope = Math.max(tope, p.e)));
  // la primera sesion es la linea de salida, no un record: es el mismo
  // criterio que usa find_prs() para no cantar un PR el dia que estrenas
  // un ejercicio
  const nuevo = has.map((p, i) => i > 0 && rec[i] > rec[i - 1]);
  let lo = Math.min(...has.map(p => p.e)), hi = Math.max(...rec);
  const pad = (hi - lo || hi * .1) * .18; lo -= pad; hi += pad;
  const X = i => P.l + (i / (has.length - 1 || 1)) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - lo) / (hi - lo || 1)) * (H - P.t - P.b);

  // escalón: el record se mantiene plano hasta el día en que cae otro
  let paso = `M${X(0).toFixed(1)},${Y(rec[0]).toFixed(1)}`;
  for (let i = 1; i < has.length; i++) {
    paso += `L${X(i).toFixed(1)},${Y(rec[i - 1]).toFixed(1)}` +
            `L${X(i).toFixed(1)},${Y(rec[i]).toFixed(1)}`;
  }
  const linea = has.map((p, i) =>
    `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.e).toFixed(1)}`).join("");
  const dots = has.map((p, i) => !nuevo[i] ? "" :
    `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.e).toFixed(1)}" r="3.8"
      fill="var(--brass)" stroke="var(--surface)" stroke-width="2"/>`).join("");

  box.innerHTML = `<div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Running record">
      ${axes(W, H, P, lo, hi)}
      <path d="${linea}" fill="none" stroke="var(--steel)" stroke-width="1.6"
        stroke-opacity=".45" stroke-linejoin="round"/>
      <path d="${paso}" fill="none" stroke="var(--brass)" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${xLabels(has, X, H)}
      <line class="cross" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)"
        stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <rect class="hit" x="${P.l}" y="${P.t}" width="${W - P.l - P.r}"
        height="${H - P.t - P.b}" fill="transparent"/>
    </svg><div class="tip"></div></div>
    <div class="legend">
      <span><i style="background:var(--steel);opacity:.45"></i>1RM of the day</span>
      <span><i style="background:var(--brass)"></i>standing record</span>
      <span>${nuevo.filter(Boolean).length} records in ${has.length} measured sessions</span>
    </div>`;

  hover(box, has, i => X(i), i => Y(rec[i]), i => {
    // desde cuándo aguanta el record que estaba vigente ese día
    let j = i; while (j > 0 && rec[j - 1] === rec[i]) j--;
    const dias = Math.round((new Date(has[i].d + "T00:00")
                           - new Date(has[j].d + "T00:00")) / 864e5);
    return `<b>${has[i].e} kg</b><span class="m">${longd(has[i].d)} · ${
      i === 0 ? "first measured session: the starting line"
      : nuevo[i] ? `new record, +${(rec[i] - rec[i - 1]).toFixed(1)} kg`
      : `record ${rec[i]} kg, unmoved for ${dias} d`}</span>`;
  });
}

/* capa de hover común a todas las gráficas */
function hover(box, pts, X, Y, html) {
  const svg = box.querySelector("svg"), tip = box.querySelector(".tip");
  const cross = box.querySelector(".cross"), hit = box.querySelector(".hit");
  if (!hit) return;
  // Unas llamadas pasan el contenedor de fuera (lineChart) y otras el propio
  // .chartbox (las de exercises). Sin el "|| box", en las segundas cb era
  // null y getBoundingClientRect reventaba en CADA movimiento del raton: las
  // graficas de ejercicio se quedaban sin tooltip y sin cruz, mudas.
  const cb = box.querySelector(".chartbox") || box;
  const at = ev => {
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    const mx = ((ev.clientX - r.left) / r.width) * vb.width;
    let best = 0, bd = Infinity;
    pts.forEach((_, i) => { const d = Math.abs(X(i) - mx); if (d < bd) { bd = d; best = i; } });
    const bb = cb.getBoundingClientRect();
    const px = (X(best) / vb.width) * r.width + (r.left - bb.left);
    const py = (Y(best) / vb.height) * r.height + (r.top - bb.top);
    if (cross) { cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best));
                 cross.setAttribute("opacity", "1"); }
    tip.innerHTML = html(best);
    tip.style.opacity = "1";
    const w = tip.offsetWidth;
    tip.style.left = Math.max(4, Math.min(px - w / 2, bb.width - w - 4)) + "px";
    tip.style.top = Math.max(2, py - tip.offsetHeight - 12) + "px";
  };
  hit.addEventListener("mousemove", at);
  hit.addEventListener("mouseleave", () => {
    tip.style.opacity = "0"; if (cross) cross.setAttribute("opacity", "0");
  });
  svg.addEventListener("touchstart", e => at(e.touches[0]), { passive: true });
}

/* mapa de constancia, estilo calendario */
function heatmap(box, daily) {
  const vol = {}; daily.forEach(d => { if (d.v) vol[d.d] = d.v; });
  const days = Object.keys(vol);
  if (!days.length) { box.innerHTML = `<p class="blank">No workouts.</p>`; return; }
  const end = new Date(days[days.length - 1] + "T00:00");
  end.setDate(end.getDate() + (6 - ((end.getDay() + 6) % 7)));
  // Arranca en la semana del PRIMER entreno, no 44 semanas fijas hacia atrás.
  // Con el corte por cambio de gimnasio solo hay 5 semanas con datos, y el
  // mapa salía como un tablero de 10 meses casi entero vacío.
  let start = new Date(days[0] + "T00:00");
  const tope = new Date(end); tope.setDate(tope.getDate() - 7 * 44 + 1);
  if (start < tope) start = tope;                    // ni más de 44 semanas
  const minimo = new Date(end); minimo.setDate(minimo.getDate() - 7 * 12 + 1);
  if (start > minimo) start = minimo;                // ni menos de 12, o queda enano
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const peak = Math.max(...Object.values(vol));
  const cols = Math.round((end - start) / 6048e5) + 1;
  const cw = 13;
  let cells = "", months = "", seen = new Set();
  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < 7; r++) {
      const dt = new Date(start); dt.setDate(dt.getDate() + c * 7 + r);
      if (dt > end) continue;
      const iso = dt.toISOString().slice(0, 10), v = vol[iso] || 0;
      const op = v ? (.28 + .72 * (v / peak)).toFixed(2) : 0;
      cells += `<rect class="hmc" x="${c * cw}" y="${r * cw}" width="${cw - 3}"
        height="${cw - 3}" rx="2.5" data-d="${iso}" data-v="${v}"
        fill="${v ? "var(--steel)" : "var(--surface-2)"}" fill-opacity="${v ? op : 1}"/>`;
    }
    const dt = new Date(start); dt.setDate(dt.getDate() + c * 7);
    if (!seen.has(dt.getMonth()) && c > 0) {
      seen.add(dt.getMonth());
      months += `<text x="${c * cw}" y="${7 * cw + 12}" font-size="10"
        fill="var(--ink-3)">${MES[dt.getMonth()]}</text>`;
    }
  }
  // El SVG se estira al ancho de la tarjeta, y con pocas semanas eso deja
  // cuadros de 70 px que parecen otra cosa. El tope los deja en ~18 px pase
  // lo que pase; con un año entero de historia no llega a aplicarse.
  box.innerHTML = `<div class="chartbox"><svg class="hm"
    viewBox="0 0 ${cols * cw} ${7 * cw + 18}" style="max-width:${cols * 22}px"
    role="img" aria-label="Days trained">${cells}${months}</svg>
    <div class="tip"></div></div>
    <div class="legend"><span>${days.length} days trained · colour is volume</span></div>`;

  // El <title> de SVG es el tooltip del navegador: tarda un segundo en salir y
  // no se puede dar estilo, asi que el mapa parecia muerto al pasar por encima.
  // Mismo tooltip que el resto de graficas.
  const cb = box.querySelector(".chartbox"), tip = box.querySelector(".tip");
  cb.querySelectorAll(".hmc").forEach(rect => {
    rect.addEventListener("mouseenter", () => {
      const iso = rect.dataset.d, v = +rect.dataset.v;
      tip.innerHTML = v
        ? `<b>${fmt(v)} kg</b><span class="m">${longd(iso)}</span>`
        : `<b>Rest</b><span class="m">${longd(iso)}</span>`;
      tip.style.opacity = "1";
      const rb = rect.getBoundingClientRect(), bb = cb.getBoundingClientRect();
      const w = tip.offsetWidth;
      tip.style.left = Math.max(4, Math.min(rb.left - bb.left + rb.width / 2 - w / 2,
                                            bb.width - w - 4)) + "px";
      tip.style.top = Math.max(2, rb.top - bb.top - tip.offsetHeight - 8) + "px";
    });
  });
  cb.addEventListener("mouseleave", () => { tip.style.opacity = "0"; });
}

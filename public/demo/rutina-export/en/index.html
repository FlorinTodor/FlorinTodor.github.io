const dlg = $("#viewer");
let redibuja = null;                 // como repintar lo que hay abierto

function abrirVisor({ titulo, nota, stats, dibuja }) {
  $("#v-title").textContent = titulo;
  $("#v-note").textContent = nota || "";
  $("#v-stats").innerHTML = (stats || [])
    .map(([l, v]) => `<div>${l}<b>${v}</b></div>`).join("");
  const cuerpo = $("#v-body");
  cuerpo.innerHTML = "";
  redibuja = () => dibuja(cuerpo);
  redibuja();
  dlg.showModal();
}

$("#v-close").onclick = () => dlg.close();
dlg.addEventListener("click", e => {          // clic fuera del panel: cerrar
  if (e.target === dlg) dlg.close();
});
dlg.addEventListener("close", () => { redibuja = null; $("#v-body").innerHTML = ""; });
// el SVG se dimensiona con el contenedor: al cambiar el tamaño hay que repintar
let temporizador;
addEventListener("resize", () => {
  if (!redibuja) return;
  clearTimeout(temporizador);
  temporizador = setTimeout(() => redibuja(), 180);
});

function resumen(pts, key, dec = 1, unidad = "") {
  const v = pts.map(p => p[key]).filter(x => x != null);
  if (!v.length) return [];
  const u = unidad ? " " + unidad : "";
  const d = v[v.length - 1] - v[0];
  return [
    ["Current", v[v.length - 1].toFixed(dec) + u],
    ["Min", Math.min(...v).toFixed(dec) + u],
    ["Max", Math.max(...v).toFixed(dec) + u],
    ["Average", (v.reduce((a, b) => a + b, 0) / v.length).toFixed(dec) + u],
    ["Total change", (d > 0 ? "+" : "") + d.toFixed(dec) + u],
    ["Data points", v.length],
  ];
}

/** Hace ampliable una tarjeta: añade el botón y engancha el clic. */
function ampliable(caja, opciones) {
  if (!caja) return;
  const b = document.createElement("button");
  b.className = "zoom";
  b.type = "button";
  b.textContent = "⤢";
  b.setAttribute("aria-label", `Expand ${opciones.titulo}`);
  b.onclick = e => { e.stopPropagation(); abrirVisor(opciones); };
  caja.appendChild(b);
  caja.addEventListener("click", e => {
    if (!e.target.closest(".zoom")) abrirVisor(opciones);
  });
}

/* ---------- calorías ----------
   Health Connect da el total del día (TotalCaloriesBurnedRecord), que YA
   incluye lo que escribe Hevy: com.hevy aparece como origen de esos totales.
   Sumar aparte las del entreno lo contaría dos veces, y además la API de Hevy
   no las da: en sus entrenos no hay ningún campo de energía.

   OJO con los días "solo basal". Samsung escribe a veces un total que es
   exactamente su estimación de metabolismo basal, sin la parte de actividad,
   incluso en días con 10.000 pasos: se reconocen porque el número se repite
   idéntico en decenas de días (y ese número cambia con el tiempo, porque su
   estimación de basal cambia), mientras que un día real siempre trae decimales
   y nunca cae dos veces en el mismo número. No son "días que quemaste poco",
   son días SIN dato de actividad, y meterlos en las medias las hunde: en datos
   reales, la diferencia entre entrenar y descansar salía casi el doble de lo
   que era.

   Se descartan of the medias y de la gráfica. Un hueco es más honesto que
   una línea plana que parece un dato.                                      */

// separa los días con gasto de verdad de los que solo traen la basal apuntada
function caloriasUtiles(d) {
  // la basal más reciente que haya dado la báscula
  const basal = [...d].reverse().find(x => x.br != null)?.br ?? null;
  const todos = d.filter(x => x.kc != null);

  // el mismo número clavado en varios días es la basal que apunta Samsung
  // cuando no registra actividad, no un gasto medido; la basal que usa cambia
  // con el tiempo, así que no vale con comparar contra la de la báscula de hoy
  const veces = {};
  todos.forEach(x => { veces[x.kc] = (veces[x.kc] || 0) + 1; });
  const soloBasal = x => veces[x.kc] >= 3 ||
    (basal != null && Math.abs(x.kc - basal) <= basal * 0.01);

  const sinBasal = todos.filter(x => !soloBasal(x));
  // recorta la racha INICIAL por debajo de la basal: un total diario menor que
  // tu metabolismo basal es imposible (la basal es el suelo del gasto), así que
  // son estimaciones incompletas del móvil de antes de llevar medidor. In cuanto
  // aparece el primer día real (>= basal) se deja de recortar; el resto no se toca.
  let ini = 0;
  if (basal != null) { while (ini < sinBasal.length && sinBasal[ini].kc < basal) ini++; }
  if (ini >= sinBasal.length) ini = 0;
  return { basal, todos, con: sinBasal.slice(ini) };
}

function tarjetaCalorias(d) {
  const { basal, todos, con } = caloriasUtiles(d);
  const descartados = todos.length - con.length;
  if (con.length < 2) return "";

  const media = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
  const entD = con.filter(x => x.v), desD = con.filter(x => !x.v);
  const ent = media(entD.map(x => x.kc));
  const des = media(desD.map(x => x.kc));
  const hoy = con[con.length - 1];
  // los últimos 7 días de calendario, no "los últimos 7 con dato": con huecos
  // de por average, lo segundo puede estar promediando un mes y llamarlo semana
  const corte = new Date(hoy.d + "T00:00"); corte.setDate(corte.getDate() - 6);
  const ventana7 = con.filter(x => new Date(x.d + "T00:00") >= corte);
  const ult7 = media(ventana7.map(x => x.kc));
  const sobreBasal = basal != null ? hoy.kc - basal : null;

  // con tres días de descanso la comparación no dice nada; se calla en vez
  // de dar un número que parece sólido y no lo es
  const MIN = 5;
  const comparable = entD.length >= MIN && desD.length >= MIN;

  const t = (v, lbl) => v == null ? "" : `<div class="tile">
    <span class="v">${Math.round(v).toLocaleString("en-GB")}<em>kcal</em></span>
    <span class="l">${lbl}</span></div>`;

  return `<div class="card" id="card-kc">
    <h3>Calories burned</h3>
    <p class="note">Day total from Health Connect · the Hevy workout is already
      included, because Hevy writes into Health Connect</p>
    ${basal != null ? `<p class="note">The <b>basal rate</b> (${Math.round(basal)} kcal, which
      the scale estimates from your composition) is what you'd burn lying down all
      day: breathing, the heart, temperature, the organs. Everything
      <b>above the line</b> is what you added by moving.</p>` : ""}
    ${descartados ? `<p class="note">Left out: <b>${descartados} days</b> in which
      no activity was recorded and only the basal rate was written: not days of burning
      little, but days with no data. That is why the chart starts on ${longd(con[0].d)} and
      has gaps.</p>` : ""}
    <div class="tiles wide">
      ${t(hoy.kc, longd(hoy.d))}
      ${t(ult7, `7-day average (${ventana7.length} with data)`)}
      ${t(ent, `Training (${entD.length} days)`)}
      ${t(des, `Resting (${desD.length} days)`)}
      ${comparable ? `<div class="tile">
        <span class="v up">+${Math.round(ent - des)}<em>kcal</em></span>
        <span class="l">What training adds</span></div>` : ""}
      ${sobreBasal != null ? `<div class="tile">
        <span class="v">${sobreBasal > 0 ? "+" : ""}${Math.round(sobreBasal)}<em>kcal</em></span>
        <span class="l">Above your basal rate${hoy.d === new Date().toISOString().slice(0, 10)
          ? " (day in progress)" : ""}</span></div>` : ""}
    </div>
    ${!comparable && desD.length ? `<p class="note">With ${desD.length} rest days
      with complete data there is nothing to compare yet against the ${entD.length}
      training ones: at least ${MIN} of each are needed.</p>` : ""}
    <div id="c-kc"></div>
  </div>`;
}

/* ---------- energía ----------
   Lo que ninguna fuente da: si comes de más o de menos. No hace falta pesar
   comida. Si el peso baja average kilo por semana, estás ~550 kcal/día por
   debajo de tu gasto, porque un kilo de tejido graso son ~7.700 kcal. Con el
   gasto medido de Health Connect encima sale la ingesta aproximada.

   El cálculo vive en insights.energia() (Python), aquí solo se pinta.       */

function tarjetaEnergia() {
  const e = IN.energia || {};
  if (!Object.keys(e).length) return "";

  if (e.faltan) {
    /* Dos carencias distintas, y confundirlas manda a pesarse mas a quien ya
       se pesa a diario: o faltan pesajes, o falta el RECORRIDO entre el
       primero y el ultimo. Seis weigh-ins in seis dias seguidos cumplen lo
       primero de sobra y no lo segundo. */
    const cortos = e.pesajes < e.min_pesajes;
    return `<div class="card">
      <h3>Energy balance</h3>
      <p class="note">How much you over- or under-eat, without weighing food</p>
      <p class="blank">${cortos
        ? `It needs <b>${e.min_pesajes} weigh-ins</b> spanning
           <b>${e.min_dias} days</b> within the last ${e.ventana}; right now there are
           <b>${e.pesajes}</b>, over ${e.dias} ${e.dias === 1 ? "day" : "days"}.
           Weigh in fasted three or four days a week and this fills itself in.`
        : `There are plenty of weigh-ins (<b>${e.pesajes}</b>): what is missing is
           <b>span</b>. The first and the last have to be
           <b>${e.min_dias} days</b> apart so the slope is fat and not the water
           of the week, and right now they span ${e.dias}.${e.listo_el
             ? ` If you keep weighing yourself, this fills in on <b>${longd(e.listo_el)}</b>.`
             : ""}`}</p>
    </div>`;
  }

  const sube = e.balance_kcal > 0;
  const cls = Math.abs(e.balance_kcal) < 150 ? "flat" : sube ? "up" : "down";
  return `<div class="card">
    <h3>Energy balance</h3>
    <p class="note">Estimated from the weight slope between ${longd(e.desde)} y
      ${longd(e.hasta)} · ${e.pesajes} weigh-ins in ${e.dias} days</p>
    <div class="tiles wide">
      <div class="tile"><span class="v ${cls}">${e.kg_semana > 0 ? "+" : ""}${
        num(e.kg_semana, 2)}<em>kg/sem</em></span>
        <span class="l">Weight trend</span></div>
      <div class="tile"><span class="v ${cls}">${e.balance_kcal > 0 ? "+" : ""}${
        num(e.balance_kcal)}<em>kcal</em></span>
        <span class="l">Daily balance</span></div>
      ${e.gasto_average ? `<div class="tile"><span class="v">${num(e.gasto_average)}<em>kcal</em></span>
        <span class="l">Average burn (${e.dias_gasto} days)</span></div>` : ""}
      ${e.ingesta_estimada ? `<div class="tile hl"><span class="v">${
        num(e.ingesta_estimada)}<em>kcal</em></span>
        <span class="l">Estimated intake</span></div>` : ""}
    </div>
    <p class="note" style="margin:12px 0 0">A kilo of fat is about 7,700 kcal.
      ${e.ingesta_estimada ? `To hold your weight you'd have to eat around
      <b>${num(e.gasto_average)} kcal</b>; by the trend, right now you are
      around <b>${num(e.ingesta_estimada)}</b>.` : ""}
      Over short windows the scale measures water as well as fat, which is why it asks for
      two weeks.</p>
  </div>`;
}

/* ================= secciones ================= */

function sectionActivity() {
  const el = $("#sec-actividad");
  const d = DATA.daily;
  const pasos = d.filter(x => x.st != null);
  const noches = d.filter(x => x.sl != null);
  const pulso = d.filter(x => x.ah != null || x.mh != null);
  const kms = d.filter(x => x.km != null);

  // eficiencia del sueño: del tiempo en la cama, cuánto duermes de verdad.
  // El tiempo despierto lo recoge la app y no se pintaba en ningún sitio.
  const conDespierto = noches.filter(x => x.sa != null);
  const efi = conDespierto.length
    ? conDespierto.reduce((a, x) => a + x.sl / (x.sl + x.sa), 0) / conDespierto.length * 100
    : null;

  el.innerHTML = `<div class="cards">
    <div class="card"><h3>Consistency</h3><p class="note">Each square is a day</p>
      <div id="c-hm"></div></div>
    <div class="card"><h3>Weekly volume</h3><p class="note">Tonnes lifted per week</p>
      <div id="c-vol"></div></div>
    <div class="card"><h3>Steps</h3><p class="note">Health Connect${
      kms.length ? ` · ${num(kms[kms.length - 1].km, 1)} km on the last day with data` : ""}</p>
      <div id="c-st"></div>
      ${kms.length >= 2 ? `<div class="minigrid" style="margin-top:16px">
        <div class="mini"><h4>Distance (km)</h4><div id="c-km"></div></div></div>` : ""}
    </div>
    <div class="card"><h3>Sleep</h3><p class="note">Stages per night, awake time aside${
      efi != null ? ` · average efficiency ${efi.toFixed(0)}%` : ""}</p>
      <div id="c-sl"></div></div>
    ${pulso.length >= 2 ? `<div class="card"><h3>Heart rate</h3>
      <p class="note">Average and peak of the day, from Health Connect${
        d.some(x => x.hr != null) ? "" : " · resting rate is not written by any app yet"}</p>
      <div id="c-hr"></div></div>` : ""}
    ${tarjetaCalorias(d)}
    ${tarjetaEnergia()}
  </div>`;
  const { basal, con: conKc } = caloriasUtiles(d);
  if (conKc.length >= 2) {
    lineChart($("#c-kc"), conKc, "kc", {
      color: PAL.brass, unit: "kcal", label: "Calories", avg: 7,
      ref: basal, refLabel: basal ? `basal ${Math.round(basal)}` : "",
    });
    const card = $("#card-kc");
    card.classList.add("zoomable");
    ampliable(card, {
      titulo: "Calories burned",
      nota: "Daily total from Health Connect · the line marks your basal metabolism",
      stats: resumen(conKc, "kc", 0, "kcal"),
      dibuja: c => lineChart(c, conKc, "kc", {
        color: PAL.brass, unit: "kcal", avg: 7,
        ref: basal, refLabel: basal ? `basal ${Math.round(basal)}` : "", h: 430 }),
    });
  }

  heatmap($("#c-hm"), d);
  $("#c-hm").closest(".card").classList.add("zoomable");
  ampliable($("#c-hm").closest(".card"), {
    titulo: "Consistency", nota: "Each square is a day; colour is volume",
    stats: [["Days trained", d.filter(x => x.v).length],
            ["Total volume", (d.reduce((a, x) => a + (x.v || 0), 0) / 1000).toFixed(0) + " t"]],
    dibuja: c => heatmap(c, d),
  });

  const byWeek = {};
  d.forEach(x => { if (!x.v) return;
    const dt = new Date(x.d + "T00:00"), y = dt.getFullYear();
    const w = Math.ceil(((dt - new Date(y, 0, 1)) / 864e5 + new Date(y, 0, 1).getDay() + 1) / 7);
    const k = `${y}-${String(w).padStart(2, "0")}`;
    byWeek[k] = byWeek[k] || { d: x.d, t: 0 }; byWeek[k].t += x.v / 1000; });
  const semanas = Object.values(byWeek);
  lineChart($("#c-vol"), semanas, "t",
            { unit: "t", zero: true, label: "Weekly volume", h: 220 });
  $("#c-vol").closest(".card").classList.add("zoomable");
  ampliable($("#c-vol").closest(".card"), {
    titulo: "Weekly volume", nota: "Tonnes lifted per week",
    stats: resumen(semanas, "t", 1, "t"),
    dibuja: c => lineChart(c, semanas, "t", { unit: "t", zero: true, h: 420 }),
  });

  lineChart($("#c-st"), pasos, "st",
            { avg: 7, unit: "pasos", zero: true, color: PAL.up, label: "Daily steps" });
  $("#c-st").closest(".card").classList.add("zoomable");
  ampliable($("#c-st").closest(".card"), {
    titulo: "Steps", nota: "Health Connect · 7-day moving average",
    stats: resumen(pasos, "st", 0),
    dibuja: c => lineChart(c, pasos, "st",
                           { avg: 7, unit: "pasos", zero: true, color: PAL.up, h: 420 }),
  });

  if (kms.length >= 2) {
    lineChart($("#c-km"), kms, "km",
              { unit: "km", zero: true, color: PAL.steel, label: "Distance", h: 150 });
    ampliable($("#c-km").closest(".mini"), {
      titulo: "Distance", nota: "Kilometres per day, from Health Connect",
      stats: resumen(kms, "km", 1, "km"),
      dibuja: c => lineChart(c, kms, "km", { unit: "km", zero: true, color: PAL.steel, h: 430 }),
    });
  }

  if (pulso.length >= 2) {
    // dos líneas en la misma caja: el peak dice cuánto aprietas, el average
    // cuánto tiempo pasas apretando
    dobleLinea($("#c-hr"), pulso, ["mh", "ah"], [PAL.down, PAL.steel],
               ["peak", "average"], "ppm");
    $("#c-hr").closest(".card").classList.add("zoomable");
    ampliable($("#c-hr").closest(".card"), {
      titulo: "Heart rate", nota: "Average and peak heart rate of the day",
      stats: resumen(pulso.filter(x => x.ah != null), "ah", 0, "ppm"),
      dibuja: c => dobleLinea(c, pulso, ["mh", "ah"], [PAL.down, PAL.steel],
                              ["peak", "average"], "ppm", 430),
    });
  }

  const fases = [["sd", "sr", "sli"], ["#2a78d6", "#5598e7", "#9ec5f4"],
                 ["deep", "REM", "light"]];
  stackChart($("#c-sl"), noches, ...fases, { label: "Sleep stages" });
  $("#c-sl").closest(".card").classList.add("zoomable");
  ampliable($("#c-sl").closest(".card"), {
    titulo: "Sleep", nota: "Stages per night, awake time aside",
    stats: resumen(noches, "sl", 1, "h"),
    dibuja: c => stackChart(c, noches, ...fases, { h: 420 }),
  });
}

/* ---------- peso ----------
   Un pesaje suelto no es tu peso: se mueve ~0,6 kg de un día a otro por agua,
   sal y la hora a la que te subes. La tendencia (mediana de 7 days) y las
   ventanas con referencia cercana son lo que hace comparable un día con otro.

   Aquí van también la altura (que no la da ninguna fuente, pero sale de
   peso e IMC), el FFMI y la cintura/altura.                                 */

function tarjetaWeight(b) {
  const c = IN.cuerpo || {}, pf = IN.perfil || {};
  const t = c.tendencia || {};
  const last = b[b.length - 1];

  const dl = (v, n, dec = 1, bueno = false) => v == null
    ? `<td title="No weigh-in near that date">—</td>`
    : `<td title="${n} real days">${delta(v, 0, { dec, bueno })}</td>`;

  return `<div class="card">
    <h3>Weight</h3>
    <p class="note">The trend is the median of 7 days of weigh-ins: a single
      weigh-in moves ~0.6 kg from one day to the next through water and the hour</p>
    <div class="tiles wide">
      <div class="tile hl"><span class="v">${num(t.actual ?? last.kg, 1)}<em>kg</em></span>
        <span class="l">Weight (trend)</span></div>
      <div class="tile"><span class="v">${num(last.kg, 1)}<em>kg</em></span>
        <span class="l">Last weigh-in · ${longd(last.d)}</span></div>
      ${pf.magra_kg ? `<div class="tile"><span class="v">${num(pf.magra_kg, 1)}<em>kg</em></span>
        <span class="l">Estimated lean mass</span></div>` : ""}
      ${pf.ffmi ? `<div class="tile"><span class="v">${num(pf.ffmi, 1)}</span>
        <span class="l">FFMI (max ${num(pf.ffmi_max, 1)})</span></div>` : ""}
      ${pf.cintura_altura ? `<div class="tile"><span class="v ${
        pf.cintura_altura < 0.5 ? "up" : "down"}">${num(pf.cintura_altura, 2)}</span>
        <span class="l">${pf.cintura_es_abdomen ? "Abdomen" : "Waist"}/altura</span></div>` : ""}
      ${pf.altura_m ? `<div class="tile"><span class="v">${num(pf.altura_m, 2)}<em>m</em></span>
        <span class="l">Height (from weight and BMI)</span></div>` : ""}
    </div>
    ${t.actual != null ? `<table class="cmp" style="margin-top:6px">
      <thead><tr><th></th><th>Now</th><th>7 d</th><th>30 d</th><th>90 d</th></tr></thead>
      <tbody><tr><td>Trend</td><td>${num(t.actual, 1)} kg</td>
        ${dl(t.d7, t.n7)}${dl(t.d30, t.n30)}${dl(t.d90, t.n90)}</tr></tbody></table>
      <p class="note" style="margin-top:10px">An empty cell means there was no
      weigh-in near that date. It used to take the most recent one there was, and
      the 7-day column could be showing a month's change.</p>` : ""}
    ${pf.cintura_altura ? `<p class="note" style="margin-top:4px">
      ${pf.cintura_es_abdomen ? "The abdomen is used because the waist hasn't been measured yet. " : ""}
      Below <b>0.50</b> is the usual health target; you are at
      <b>${num(pf.cintura_altura, 2)}</b> con ${num(pf.abdomen_cm ?? pf.cintura_cm, 1)} cm
      measured on ${longd(pf.cintura_fecha)}.</p>` : ""}
  </div>`;
}

function sectionBody() {
  const el = $("#sec-cuerpo");
  const b = DATA.daily.filter(x => x.kg != null);
  if (!b.length) {
    // puede no haber pesajes y si haber medidas de cinta: se meten a mano
    const solaCinta = bloqueMedidas();
    el.innerHTML = solaCinta.html
      ? `<div class="cards">${solaCinta.html}</div>`
      : `<div class="card"><h3>Body</h3><p class="blank">No weigh-ins yet.</p></div>`;
    solaCinta.pintar();
    return;
  }

  // clave, etiqueta, unidad, decimales, si subir es bueno (null = neutro)
  const M = [
    ["kg", "Weight",               "kg",   1, false],
    ["fa", "Body fat",     "%",    1, false],
    ["fm", "Fat",              "kg",   1, false],
    ["mu", "Muscle mass",      "kg",   1, true ],
    ["sk", "Skeletal muscle","%",    1, true ],
    ["lm", "Lean mass",         "kg",   1, true ],
    ["wa", "Body water",      "%",    1, true ],
    ["pr", "Protein",           "%",    1, true ],
    ["vi", "Visceral fat",     "",     1, false],
    ["sc", "Subcutaneous fat",   "%",    1, false],
    ["bmi","IMC",                "",     1, false],
    ["bo", "Bone mass",          "kg",   1, null ],
    ["br", "Basal metabolism",  "kcal", 0, null ],
    ["ag", "Body age",      "yrs", 0, false],
  ].filter(([k]) => b.some(x => x[k] != null));

  const last = b[b.length - 1];
  // referencia: el pesaje mas cercano a hace 30 dias
  const objetivo = new Date(last.d + "T00:00"); objetivo.setDate(objetivo.getDate() - 30);
  let ref = b[0];
  for (const x of b) if (new Date(x.d + "T00:00") <= objetivo) ref = x;

  const tiles = M.map(([k, lbl, u, dec, bueno]) => {
    const v = last[k], p = ref[k];
    let delta = "";
    if (v != null && p != null && ref !== last) {
      const d = v - p;
      const cls = bueno === null || Math.abs(d) < 0.05 ? "flat"
                : (d > 0) === bueno ? "up" : "down";
      delta = `<span class="chg ${cls}">${d > 0 ? "+" : ""}${d.toFixed(dec)}</span>`;
    }
    return `<div class="tile">
      <span class="v">${v != null ? v.toFixed(dec) : "—"}<em>${u}</em></span>
      <span class="l">${lbl}</span>${delta}</div>`;
  }).join("");

  const charts = M.filter(([k]) => b.filter(x => x[k] != null).length >= 2)
    .map(([k, lbl, u]) => `<div class="mini"><h4>${lbl}</h4><div id="cb-${k}"></div></div>`)
    .join("");

  const cols = ["d", ...M.map(([k]) => k)];
  const filas = [...b].reverse().slice(0, 20).map(x => `<tr>
      <td>${longd(x.d)}</td>
      ${M.map(([k, , , dec]) => `<td>${x[k] != null ? x[k].toFixed(dec) : "—"}</td>`).join("")}
    </tr>`).join("");

  const cinta = bloqueMedidas();

  el.innerHTML = `<div class="cards">
    <div class="card">
      <h3>Right now</h3>
      <p class="note">${longd(last.d)} · change is against 30 days ago</p>
      <div class="tiles wide">${tiles}</div>
    </div>
    <div class="card">
      <h3>Trend</h3>
      <p class="note">${b.length} weigh-ins since ${longd(b[0].d)}</p>
      <div class="minigrid">${charts}</div>
    </div>
    <div class="card">
      <h3>Latest weigh-ins</h3>
      <div class="tblwrap"><table>
        <thead><tr><th>Date</th>${M.map(([, l, u]) =>
          `<th>${l}${u ? " (" + u + ")" : ""}</th>`).join("")}</tr></thead>
        <tbody>${filas}</tbody></table></div>
    </div>
    ${cinta.html}
    ${tarjetaWeight(b)}
  </div>`;

  const color = { fa: PAL.down, fm: PAL.down, sc: PAL.down, vi: PAL.down,
                  mu: PAL.up, sk: PAL.up, lm: PAL.up, pr: PAL.up, wa: PAL.steel };
  M.forEach(([k, lbl, u, dec]) => {
    const box = $("#cb-" + k);
    if (!box) return;
    const col = color[k] || PAL.brass;
    lineChart(box, b, k, { color: col, unit: u, label: lbl, h: 150 });
    ampliable(box.closest(".mini"), {
      titulo: lbl, nota: `${b.filter(x => x[k] != null).length} weigh-ins since ${longd(b[0].d)}`,
      stats: resumen(b, k, dec, u),
      dibuja: c => lineChart(c, b, k, { color: col, unit: u, h: 430 }),
    });
  });

  cinta.pintar();
}

/* ---------- medidas de cinta ----------
   Van dentro de "Body" y no en una pestana propia: son dato corporal, y
   con dos metricas al principio una pestana entera quedaria vacia.

   La referencia NO es "hace 30 dias" como en los pesajes, sino la tanda
   anterior: estas medidas se toman cada semana y lo que interesa es que ha
   cambiado desde la ultima vez.                                            */

function bloqueMedidas() {
  const CLAVES = [
    ["tcu", "Neck",           null],
    ["tpe", "Chest",            null],
    ["tci", "Waist",          false],
    ["tab", "Abdomen",          false],
    ["tca", "Hip",           false],
    ["tbi", "Left arm",       null],
    ["tbd", "Right arm",       null],
    ["tai", "Left forearm",   null],
    ["tad", "Right forearm",   null],
    ["tmi", "Left thigh",       null],
    ["tmd", "Right thigh",       null],
    ["tgi", "Left calf",      null],
    ["tgd", "Right calf",      null],
  ];

  const t = DATA.daily.filter(x => CLAVES.some(([k]) => x[k] != null));
  if (!t.length) return { html: "", pintar: () => {} };

  // solo las que se han medido alguna vez: lo que no se mide no se pinta
  const M = CLAVES.filter(([k]) => t.some(x => x[k] != null));
  const last = t[t.length - 1];
  const prev = t.length > 1 ? t[t.length - 2] : null;

  const tiles = M.map(([k, lbl, bueno]) => {
    const v = last[k], p = prev ? prev[k] : null;
    let chg = "";
    if (v != null && p != null) {
      const d = v - p;
      // sin criterio de "mejor" en las extremidades: crecer un brazo es
      // bueno y crecer otra cosa depende del objetivo, asi que solo se
      // colorean cintura, abdomen y cadera, que si son marcador de grasa
      const cls = bueno === null || Math.abs(d) < 0.05 ? "flat"
                : (d > 0) === bueno ? "up" : "down";
      chg = `<span class="chg ${cls}">${d > 0 ? "+" : ""}${d.toFixed(1)}</span>`;
    }
    return `<div class="tile">
      <span class="v">${v != null ? v.toFixed(1) : "—"}<em>cm</em></span>
      <span class="l">${lbl}</span>${chg}</div>`;
  }).join("");

  const charts = M.filter(([k]) => t.filter(x => x[k] != null).length >= 2)
    .map(([k, lbl]) => `<div class="mini"><h4>${lbl}</h4><div id="tm-${k}"></div></div>`)
    .join("");

  const filas = [...t].reverse().slice(0, 20).map(x => `<tr>
      <td>${longd(x.d)}</td>
      ${M.map(([k]) => `<td>${x[k] != null ? x[k].toFixed(1) : "—"}</td>`).join("")}
      <td class="nota">${x.tn ? x.tn : ""}</td>
    </tr>`).join("");

  // asimetria: por eso se miden los dos lados por separado. Un brazo 1 cm
  // mayor que el otro no se ve en el espejo pero sale aqui.
  const PARES = [["tbi", "tbd", "Arm"], ["tai", "tad", "Forearm"],
                 ["tmi", "tmd", "Thigh"], ["tgi", "tgd", "Calf"]];
  const asim = PARES.filter(([i, d]) => last[i] != null && last[d] != null)
    .map(([i, d, lbl]) => {
      const dif = last[d] - last[i];
      return `<div class="tile"><span class="v ${Math.abs(dif) >= 1 ? "down" : "flat"}">${
        dif > 0 ? "+" : ""}${dif.toFixed(1)}<em>cm</em></span>
        <span class="l">${lbl}: right − left</span></div>`;
    }).join("");

  const desde = longd(t[0].d);
  const html = `
    ${asim ? `<div class="card">
      <h3>Asymmetry</h3>
      <p class="note">Right minus left, in the latest round (${longd(last.d)}).
        Under 1 cm is measurement noise; over it, something to look at</p>
      <div class="tiles wide">${asim}</div>
    </div>` : ""}
    <div class="card">
      <h3>Tape measure</h3>
      <p class="note">${longd(last.d)}${prev ? " · change is against the previous measurement, "
        + longd(prev.d) : ""}</p>
      <div class="tiles wide">${tiles}</div>
    </div>
    ${charts ? `<div class="card">
      <h3>Measurement trend</h3>
      <p class="note">${t.length} measurements since ${desde}</p>
      <div class="minigrid">${charts}</div>
    </div>` : ""}
    <div class="card">
      <h3>Measurement history</h3>
      <div class="tblwrap"><table>
        <thead><tr><th>Date</th>${M.map(([, l]) => `<th>${l} (cm)</th>`).join("")}
          <th>Note</th></tr></thead>
        <tbody>${filas}</tbody></table></div>
    </div>`;

  const pintar = () => {
    M.forEach(([k, lbl]) => {
      const box = $("#tm-" + k);
      if (!box) return;
      const col = k === "tab" || k === "tci" || k === "tca" ? PAL.down : PAL.up;
      lineChart(box, t, k, { color: col, unit: "cm", label: lbl, h: 150 });
      ampliable(box.closest(".mini"), {
        titulo: lbl,
        nota: `${t.filter(x => x[k] != null).length} measurements since ${desde}`,
        stats: resumen(t, k, 1, "cm"),
        dibuja: c => lineChart(c, t, k, { color: col, unit: "cm", h: 430 }),
      });
    });
  };

  return { html, pintar };
}

/* ================= resumen ================= */

const IN = DATA.insights || {};

const num = (v, d = 0) => v == null ? "—" : v.toLocaleString("en-GB",
  { minimumFractionDigits: d, maximumFractionDigits: d });

function delta(act, prev, { dec = 0, bueno = true, unidad = "" } = {}) {
  if (act == null || prev == null) return "";
  const d = act - prev;
  if (Math.abs(d) < (dec ? 0.05 : 0.5)) return `<span class="flat">same</span>`;
  const cls = (d > 0) === bueno ? "up" : "down";
  return `<span class="${cls}">${d > 0 ? "+" : ""}${num(d, dec)}${unidad}</span>`;
}

function tablaComparativa(a, b, etiquetas, filas) {
  return `<table class="cmp">
    <thead><tr><th></th><th>${etiquetas[0]}</th><th>${etiquetas[1]}</th><th>Change</th></tr></thead>
    <tbody>${filas.map(([k, lbl, dec, bueno, u]) => `<tr>
      <td>${lbl}</td>
      <td>${num(a[k], dec)}${u || ""}</td>
      <td>${num(b[k], dec)}${u || ""}</td>
      <td>${delta(a[k], b[k], { dec, bueno, unidad: u || "" })}</td>
    </tr>`).join("")}</tbody></table>`;
}

/* Sets efectivas por músculo y semana, contra una referencia externa.

   Sustituye a comparar tu reparto contra tu propio histórico: con cinco
   semanas de datos, el histórico ES el último mes, todos los desvíos salen
   ~0 y el aviso "estás descuidando X" no puede saltar nunca. Aquí la
   referencia es el rango que se suele recomendar (10-20 series por grupo y
   semana), que no depende de cuánta historia tengas.                        */
function seriesPorMusculo(ss) {
  const ms = (ss && ss.musculos) || [];
  if (!ms.length) return `<p class="blank">Not enough workouts yet.</p>`;
  const max = Math.max(...ms.map(m => Math.max(m.media, 22)), 1);
  const cls = e => e === "bajo" ? "down" : e === "alto" ? "flat" : "up";

  return `<div class="bal">${ms.map(m => `
    <div class="fila">
      <span class="nom" title="${m.musculo}">${m.musculo}</span>
      <span class="barra" title="Week by week: ${m.serie.join(", ")}">
        <i style="width:${(m.media / max * 100).toFixed(1)}%;
           background:var(--${cls(m.estado)})"></i>
        <u style="left:${(10 / max * 100).toFixed(1)}%" title="10 sets"></u>
        <u style="left:${(20 / max * 100).toFixed(1)}%" title="20 sets"></u>
      </span>
      <span class="val">${num(m.media, 1)}${m.semanas_cero
        ? `<span class="m" style="color:var(--ink-3)"> · ${m.semanas_cero}/${
           ss.n_semanas} wk at 0</span>` : ""}</span>
    </div>`).join("")}</div>
  <p class="note" style="margin-top:12px">Average working sets per week over
    the last ${ss.n_semanas} weeks (${num(ss.total_average, 0)} in total). The two
    grey marks are 10 and 20 sets, the range where the work that pays off usually
    sits. Hover a bar to see it week by week.</p>`;
}

function avisos() {
  const out = [];

  // lo que falta contra una referencia externa, no contra tu propio histórico
  const ss = IN.series_semanales || {};
  const bajos = (ss.musculos || []).filter(m => m.estado === "bajo")
    .sort((a, b) => a.media - b.media);
  if (bajos.length) {
    const peor = bajos[bajos.length - 1];
    out.push(["🦵", `Below 10 weekly sets: <b>${
      bajos.map(m => m.musculo).join(", ")}</b>. ${peor.musculo} is at ${num(peor.media, 1)} sets on average
      and has been at zero for ${peor.semanas_cero} of the last ${ss.n_semanas} weeks.`]);
  }
  const altos = (ss.musculos || []).filter(m => m.estado === "alto");
  if (altos.length) {
    out.push(["📈", `Above 22 weekly sets: <b>${
      altos.map(m => `${m.musculo} (${num(m.media, 1)})`).join(", ")}</b>.
      More is not always better when other groups sit at zero.`]);
  }

  const en = IN.energia || {};
  if (en.balance_kcal != null) {
    const d = en.balance_kcal;
    out.push([d < -100 ? "🔥" : d > 100 ? "🍽️" : "⚖️",
      Math.abs(d) < 100
        ? `Weight has been flat for ${en.dias} days: you are eating about what
           you burn.`
        : `Weight is moving at <b>${num(en.kg_semana, 2)} kg per week</b>, which is a
           ${d < 0 ? "deficit" : "surplus"} of <b>${num(Math.abs(d))} kcal a
           day</b>${en.ingesta_estimada ? `; eating around
           ${num(en.ingesta_estimada)} kcal` : ""}.`]);
  }

  const ci = IN.cinta || {};
  if (ci.toca) {
    out.push(["📏", ci.tandas
      ? `It has been <b>${ci.dias} days</b> since the last tape-measure round
         (due every ${ci.cada}).`
      : `You haven't taken any tape measurements yet.`]);
  }

  const c = IN.cuerpo || {};
  if (c.grasa_kg?.d90 != null && c.musculo?.d90 != null) {
    const g = c.grasa_kg.d90, m = c.musculo.d90;
    if (Math.abs(g) > 1 || Math.abs(m) > 1) {
      const parte = g + m === 0 ? 0 : Math.abs(g) / (Math.abs(g) + Math.abs(m)) * 100;
      const verbo = (x) => x > 0 ? "gained" : "lost";
      const mismo = (g > 0) === (m > 0);
      out.push([g > 0 ? "⚖️" : "🔥",
        mismo
          ? `In 90 days you have ${verbo(g)} <b>${num(Math.abs(g), 1)} kg of fat</b> y
             <b>${num(Math.abs(m), 1)} kg of muscle</b>. El ${num(parte, 0)}% of what you
             ${g > 0 ? "gained" : "lost"} is fat.`
          : `In 90 days you have ${verbo(g)} <b>${num(Math.abs(g), 1)} kg of fat</b> y
             ${verbo(m)} <b>${num(Math.abs(m), 1)} kg of muscle</b>.`]);
    }
  }
  const est = IN.exercises || [];
  const abandonados = est.filter(e => e.estado === "abandonado").length;
  if (abandonados) {
    const cerca = est.filter(e => e.estado === "abandonado")
      .sort((a, b) => a.dias - b.dias).slice(0, 2).map(e => e.titulo);
    out.push(["📉", `<b>${abandonados} exercises</b> have gone untouched for over two months.
      The most recent: ${cerca.join(", ")}.`]);
  }
  const r = IN.rachas || {};
  if (r.actual >= 3) {
    out.push(["🔥", `You have trained <b>${r.actual} weeks in a row</b>.
      Your best streak is ${r.mejor}.`]);
  }
  return out;
}

function sectionOverview() {
  const el = $("#sec-resumen");
  // Los entrenos se cuentan desde un corte (cambio de gimnasio). Decirlo evita
  // que parezca que falta historia, y avisa de contra qué se compara.
  const aviso = DATA.desde ? `<div class="card"><h3>Since ${longd(DATA.desde)}</h3>
    <p class="note">Only workouts from that date count, when you
    changed gyms. Earlier ones are still in Hevy, but they don't count towards
    records, progressions or volume: other machines and other pulleys mean that
    60 kg there aren't 60 kg here.</p></div>` : "";
  const s = IN.semana || {}, sp = IN.semana_previa || {};
  const m = IN.mes || {}, mp = IN.mes_previo || {};
  const c = IN.cuerpo || {};
  const r = IN.rachas || {};
  const est = IN.exercises || [];
  const cuenta = e => est.filter(x => x.estado === e).length;

  const cuerpoFilas = [
    ...(c.tendencia?.actual != null ? [["tendencia", "Weight (7-day trend)", "kg", 1, false]] : []),
    ["peso", "Weight", "kg", 1, false],
    ["grasa_kg", "Fat", "kg", 1, false],
    ["musculo", "Muscle", "kg", 1, true],
    ["visceral", "Visceral fat", "", 1, false],
  ].filter(([k]) => c[k]?.actual != null);

  el.innerHTML = `<div class="cards">${aviso}

    <div class="card">
      <h3>How it's going</h3>
      <p class="note">What changed, not what is</p>
      <div class="pills">
        <span class="pill">Streak <b>${r.actual || 0}</b> weeks</span>
        <span class="pill">Best <b>${r.mejor || 0}</b></span>
        <span class="pill">Last workout <b>${r.dias_desde ?? "—"}</b> d</span>
        <span class="pill">Progressing <b>${cuenta("progresa")}</b></span>
        <span class="pill">Stalled <b>${cuenta("estancado")}</b></span>
        <span class="pill">Dropped <b>${cuenta("abandonado")}</b></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
        ${avisos().map(([ic, t]) =>
          `<div class="aviso"><span class="ic">${ic}</span><span>${t}</span></div>`).join("")}
      </div>
    </div>

    <div class="duo">
      <div class="card"><h3>This week</h3>
        <p class="note">${s.desde} → ${s.hasta}, against the 7 days before</p>
        ${tablaComparativa(s, sp, ["Now", "Before"], [
          ["sessions", "Sessions", 0, true, ""],
          ["volumen", "Volume", 0, true, " kg"],
          ["series", "Sets", 0, true, ""],
          ["minutos", "Minutes", 0, true, ""],
          ["pasos", "Steps/day", 0, true, ""],
          ["sueno", "Sleep", 2, true, " h"],
        ])}
      </div>
      <div class="card"><h3>This month</h3>
        <p class="note">Last 30 days, against the 30 before</p>
        ${tablaComparativa(m, mp, ["Now", "Before"], [
          ["sessions", "Sessions", 0, true, ""],
          ["volumen", "Volume", 0, true, " kg"],
          ["series", "Sets", 0, true, ""],
          ["minutos", "Minutes", 0, true, ""],
          ["pasos", "Steps/day", 0, true, ""],
          ["sueno", "Sleep", 2, true, " h"],
        ])}
      </div>
    </div>

    <div class="duo">
      <div class="card"><h3>Sets per muscle</h3>
        <p class="note">Weekly average against the range that works, not against your own history</p>
        ${seriesPorMusculo(IN.series_semanales || {})}
      </div>
      <div class="card"><h3>Body composition</h3>
        <p class="note">${cuerpoFilas.length
          ? "Change over 7, 30 and 90 days · an empty cell means there was no weigh-in nearby"
          : ""}</p>
        ${cuerpoFilas.length ? `<table class="cmp">
          <thead><tr><th></th><th>Now</th><th>7 d</th><th>30 d</th><th>90 d</th></tr></thead>
          <tbody>${cuerpoFilas.map(([k, lbl, u, dec, bueno]) => `<tr>
            <td>${lbl}</td>
            <td>${num(c[k].actual, dec)}${u}</td>
            ${[7, 30, 90].map(dd => `<td${c[k]["n" + dd] ? ` title="${c[k]["n" + dd]} real days"` : ""}>${
              c[k]["d" + dd] == null ? "—" : delta(c[k].actual, c[k].actual - c[k]["d" + dd],
                                                   { dec, bueno })}</td>`).join("")}
          </tr>`).join("")}</tbody></table>`
        : `<p class="blank">Not enough weigh-ins.</p>`}
      </div>
    </div>

  </div>`;
}

/* ================= navegación ================= */

let built = {};
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  const t = b.dataset.t;
  document.querySelectorAll(".tab").forEach(x =>
    x.setAttribute("aria-selected", String(x.dataset.t === t)));
  ["resumen", "fuerza", "actividad", "cuerpo"].forEach(k =>
    $("#sec-" + k).hidden = k !== t);
  if (!built[t]) {
    if (t === "fuerza") render();
    if (t === "actividad") sectionActivity();
    if (t === "cuerpo") sectionBody();
    built[t] = true;
  }
});

sectionOverview();
</script>
